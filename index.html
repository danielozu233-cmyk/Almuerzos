<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch | UPANA</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* --- Header & Glassmorphism --- */
        .container {
            width: 100%;
            max-width: 1100px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 { font-weight: 700; font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Form Elements --- */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        input[type="date"] {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input[type="date"]:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-generate { background: var(--primary); color: white; }
        .btn-generate:hover { transform: scale(1.05); background: #4f46e5; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }

        .btn-pdf { background: transparent; border: 2px solid var(--accent); color: var(--accent); display: none; }
        .btn-pdf:hover { background: var(--accent); color: white; }

        /* --- Weeks Grid --- */
        .weeks-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .week-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .week-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .week-title { font-weight: 700; color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .day-row { margin-bottom: 12px; font-size: 0.9rem; }
        .day-name { font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .schedule-tag {
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 6px;
            display: block;
            margin: 5px 0;
            font-size: 0.85rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>Lunch</h1>
            <p>Almuerzos para que convivamos con todos lo compañeros de UPANA y seamos felices</p>
            
            <div class="controls">
                <div style="text-align: left;">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px; opacity: 0.7;">Fecha Inicial:</label>
                    <input type="date" id="startDate">
                </div>
                <div style="display:flex; align-items: flex-end; gap: 10px;">
                    <button class="btn btn-generate" onclick="generateSchedule()">Generar Mes</button>
                    <button class="btn btn-pdf" id="pdfBtn" onclick="exportToPDF()">Descargar PDF</button>
                </div>
            </div>
        </div>

        <div id="weeksGrid" class="weeks-container"></div>
    </div>

<script>
    const agentes = [
        { nombre: "Saraí Churumia", ext: 8001 }, { nombre: "Gabriela Jaes", ext: 8002 },
        { nombre: "Javier Alvarez", ext: 8003 }, { nombre: "Merlin Bajan", ext: 8004 },
        { nombre: "Mónica Ordóñez", ext: 8005 }, { nombre: "Alejandro Vásquez", ext: 8006 },
        { nombre: "Joselyne Velásquez", ext: 8007 }, { nombre: "Jackeline Castillo", ext: 8008 },
        { nombre: "Mildred Cordero", ext: 8009 }, { nombre: "Tania de León", ext: 8010 },
        { nombre: "Anthony García", ext: 8011 }, { nombre: "Jorge Veliz", ext: 8013 },
        { nombre: "Daniel Coyoy", ext: 8014 }, { nombre: "Nestor Galvez", ext: 8015 },
        { nombre: "Andrea Jiménez", ext: 8016 }, { nombre: "Diego Chiché", ext: 8017 },
        { nombre: "Ashley López", ext: 8018 }, { nombre: "Synndy Sanchez", ext: 8020 },
        { nombre: "Mishell de León", ext: 8021 }, { nombre: "Omar Ramirez", ext: 8022 },
        { nombre: "Madelin Ovando", ext: 8023 }, { nombre: "Evelyn de León", ext: 8024 },
        { nombre: "Andres Marín", ext: 8025 }, { nombre: "Bryan Hernandez", ext: 8026 },
        { nombre: "Rafael Sánchez", ext: 8027 }, { nombre: "Marta Morales", ext: 8028 },
        { nombre: "Pablo Ibañez", ext: 8029 }, { nombre: "María Perdomo", ext: 8030 }
    ];

    const slots = ["12:00 - 13:00", "13:00 - 14:00", "15:00 - 16:00"];
    let fullScheduleData = [];

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateSchedule() {
        const startInput = document.getElementById('startDate').value;
        if (!startInput) return alert("Selecciona una fecha de inicio");

        const grid = document.getElementById('weeksGrid');
        const pdfBtn = document.getElementById('pdfBtn');
        grid.innerHTML = "";
        fullScheduleData = [];

        let currentDate = new Date(startInput);
        currentDate.setMinutes(currentDate.getMinutes() + currentDate.getTimezoneOffset());

        // Generar 4 semanas
        for (let w = 0; w < 4; w++) {
            let weekObj = { weekNum: w + 1, days: [] };
            const weekDiv = document.createElement('div');
            weekDiv.className = "week-card";
            
            let weekHTML = `<div class="week-title">Semana ${w + 1}</div>`;

            // Lunes a Viernes
            for (let d = 0; d < 5; d++) {
                let dayDate = new Date(currentDate);
                dayDate.setDate(currentDate.getDate() + (w * 7) + d);
                
                let shuffledAgentes = shuffle([...agentes]);
                let distribution = [[], [], []];

                // Repartir agentes equitativamente
                shuffledAgentes.forEach((ag, index) => {
                    distribution[index % 3].push(ag.nombre);
                });

                let dayName = dayDate.toLocaleDateString('es-GT', { weekday: 'long', day: 'numeric', month: 'short' });
                weekHTML += `
                    <div class="day-row">
                        <span class="day-name">${dayName}</span>
                        <div class="schedule-tag"><strong>12-1:</strong> ${distribution[0].length} Agentes</div>
                        <div class="schedule-tag"><strong>1-2:</strong> ${distribution[1].length} Agentes</div>
                        <div class="schedule-tag"><strong>3-4:</strong> ${distribution[2].length} Agentes</div>
                    </div>
                `;

                weekObj.days.push({
                    date: dayName,
                    slots: {
                        "12:00-13:00": distribution[0],
                        "13:00-14:00": distribution[1],
                        "15:00-16:00": distribution[2]
                    }
                });
            }
            
            weekDiv.innerHTML = weekHTML;
            grid.appendChild(weekDiv);
            fullScheduleData.push(weekObj);
        }

        pdfBtn.style.display = "block";
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.setTextColor(99, 102, 241);
        doc.text("HORARIOS DE ALMUERZO - AGENTES UPANA", 105, 20, null, null, "center");
        
        let yPos = 30;

        fullScheduleData.forEach((week) => {
            doc.setFontSize(14);
            doc.setTextColor(168, 85, 247);
            doc.text(`SEMANA ${week.weekNum}`, 14, yPos);
            yPos += 5;

            week.days.forEach(day => {
                const tableData = [
                    ["12:00 - 13:00", day.slots["12:00-13:00"].join(", ")],
                    ["13:00 - 14:00", day.slots["13:00-14:00"].join(", ")],
                    ["15:00 - 16:00", day.slots["15:00-16:00"].join(", ")]
                ];

                doc.autoTable({
                    startY: yPos,
                    head: [[{ content: day.date.toUpperCase(), colSpan: 2, styles: { halign: 'center', fillColor: [30, 41, 59] } }]],
                    body: tableData,
                    theme: 'grid',
                    styles: { fontSize: 8, cellPadding: 2 },
                    headStyles: { fillColor: [99, 102, 241] },
                    columnStyles: { 0: { cellWidth: 30, fontStyle: 'bold' } }
                });
                
                yPos = doc.lastAutoTable.finalY + 10;

                if (yPos > 260) {
                    doc.addPage();
                    yPos = 20;
                }
            });
            yPos += 10;
        });

        doc.save("Planificacion_Almuerzos_Pro.pdf");
    }
</script>
</body>
</html>
