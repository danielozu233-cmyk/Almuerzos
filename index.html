<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Almuerzos CC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0f172a; --blue: #2563eb; --accent: #38bdf8; }
        body { background: var(--navy); color: white; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .card { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 24px; text-align: center; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 550px; }
        h1 span { color: var(--accent); }
        .btn { padding: 14px 30px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; background: var(--blue); color: white; transition: 0.4s; width: 100%; margin-top: 20px; }
        .btn:hover { background: #1d4ed8; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); }
        input { padding: 14px; border-radius: 10px; border: none; width: 100%; margin-top: 10px; background: #1e293b; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Almuerzos <span>CC</span></h1>
        <p style="opacity: 0.7; font-size: 0.9rem;">Cronograma Mensual</p>
        <div style="text-align: left; margin-top: 25px;">
            <label style="font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; font-weight: 600;">FECHA INICIAL (LUNES SEMANA 1)</label>
            <input type="date" id="startDate">
        </div>
        <button class="btn" onclick="generateMonthly()">Descargar</button>
    </div>

<script>
    const agentes = [
        { nombre: "Saraí Churumia", fac: "Económicas", in10: true },
        { nombre: "Gabriela Jaes", fac: "Económicas" },
        { nombre: "Javier Alvarez", fac: "Económicas", out4: true },
        { nombre: "Merlin Bajan", fac: "Odonto.", fijo12: true },
        { nombre: "Mónica Ordóñez", fac: "Odonto." },
        { nombre: "Alejandro Vásquez", fac: "Salud", out4: true }, 
        { nombre: "Joselyne Velásquez", fac: "Salud" },
        { nombre: "Jackeline Castillo", fac: "Salud", in10: true },
        { nombre: "Mildred Cordero", fac: "Jurídicas", out4: true }, 
        { nombre: "Tania de León", fac: "Jurídicas", in10: true },
        { nombre: "Anthony García", fac: "Jurídicas", out4: true }, 
        { nombre: "Daniel Coyoy", fac: "Médicas" }, // Jorge Veliz removido de aquí
        { nombre: "Nestor Galvez", fac: "FACOM", in10: true },
        { nombre: "Andrea Jiménez", fac: "FACOM" },
        { nombre: "Diego Chiché", fac: "FACOM" },
        { nombre: "Ashley López", fac: "FACEDU", out4: true },
        { nombre: "Synndy Sanchez", fac: "FACEDU" },
        { nombre: "Mishell de León", fac: "FACEDU", in10: true },
        { nombre: "Madelin Ovando", fac: "Humanidades" },
        { nombre: "Andres Marín", fac: "Ingeniería", out4: true },
        { nombre: "Bryan Hernandez", fac: "Ingeniería" },
        { nombre: "Rafael Sánchez", fac: "Arquitectura", in10: true },
        { nombre: "Marta Morales", fac: "Teología", in10: true },
        { nombre: "Pablo Ibañez", fac: "UVIRTUAL", out4: true }, 
        { nombre: "María Perdomo", fac: "UVIRTUAL" }
    ];

    const ordenFacultades = [
        "FACOM", "FACEDU", "Económicas", "Salud", "Jurídicas", 
        "Ingeniería", "Arquitectura", "Odonto.", "Médicas", 
        "Humanidades", "UVIRTUAL", "Teología"
    ];

    const coloresFacultad = {
        "FACOM": [31, 110, 140],       
        "FACEDU": [100, 180, 220],     
        "Económicas": [190, 80, 40],   
        "Salud": [210, 160, 10],       
        "Jurídicas": [180, 20, 20],     
        "Ingeniería": [60, 60, 60],     
        "Odonto.": [120, 40, 120],     
        "Humanidades": [20, 20, 20],   
        "UVIRTUAL": [40, 140, 60],     
        "Teología": [100, 150, 190],   
        "Arquitectura": [150, 70, 30], 
        "Médicas": [210, 160, 10]      
    };

    function intentarDistribucion() {
        let slots = [[], [], []];
        let facsPorSlot = [new Set(), new Set(), new Set()];
        let pool = [...agentes].sort(() => Math.random() - 0.5);

        let mIdx = pool.findIndex(a => a.fijo12);
        if(mIdx !== -1) { 
            let m = pool.splice(mIdx, 1)[0]; 
            slots[0].push(m); 
            facsPorSlot[0].add(m.fac);
        }

        const maxCapacidad = Math.ceil(agentes.length / 3); 

        for (let ag of pool) {
            let slotsPermitidos = [0, 1, 2].filter(s => {
                if (ag.in10 && s === 0) return false;
                if (ag.out4 && s === 2) return false;
                if (slots[s].length >= maxCapacidad) return false; 
                return true;
            });

            slotsPermitidos.sort((a, b) => {
                let tieneFacA = facsPorSlot[a].has(ag.fac) ? 1 : 0;
                let tieneFacB = facsPorSlot[b].has(ag.fac) ? 1 : 0;
                if (tieneFacA !== tieneFacB) return tieneFacA - tieneFacB;
                return slots[a].length - slots[b].length;
            });

            if (slotsPermitidos.length === 0) return null; 

            let seleccionado = slotsPermitidos[0];
            slots[seleccionado].push(ag);
            facsPorSlot[seleccionado].add(ag.fac);
        }

        for (let i = 0; i < 3; i++) {
            let conteoFacultades = {};
            for (let ag of slots[i]) {
                conteoFacultades[ag.fac] = (conteoFacultades[ag.fac] || 0) + 1;
                if (conteoFacultades[ag.fac] > 1) {
                    return null; 
                }
            }
        }

        return slots;
    }

    function generateMonthly() {
        const startStr = document.getElementById('startDate').value;
        if(!startStr) return alert("Selecciona el lunes inicial.");
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        let baseDate = new Date(startStr + "T00:00:00");

        let yPos = 15;

        for(let w=0; w<4; w++) {
            let weekStart = new Date(baseDate); weekStart.setDate(baseDate.getDate() + (w * 7));
            let weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 4);
            
            let slots = null;
            let intentos = 0;
            while (!slots && intentos < 5000) {
                slots = intentarDistribucion();
                intentos++;
            }

            if (!slots) {
                alert(`No se logró una combinación perfecta para la Semana ${w+1} debido a las restricciones horarias. Inténtalo de nuevo.`);
                return;
            }

            for (let i = 0; i < 3; i++) {
                slots[i].sort((a, b) => ordenFacultades.indexOf(a.fac) - ordenFacultades.indexOf(b.fac));
            }

            let maxFilas = Math.max(slots[0].length, slots[1].length, slots[2].length);
            let bodyData = [];

            for (let f = 0; f < maxFilas; f++) {
                bodyData.push([
                    slots[0][f] ? { content: `${slots[0][f].nombre}\n(${slots[0][f].fac})`, data: slots[0][f] } : "",
                    slots[1][f] ? { content: `${slots[1][f].nombre}\n(${slots[1][f].fac})`, data: slots[1][f] } : "",
                    slots[2][f] ? { content: `${slots[2][f].nombre}\n(${slots[2][f].fac})`, data: slots[2][f] } : ""
                ]);
            }

            const rango = `${weekStart.getDate()}/${weekStart.getMonth()+1} al ${weekEnd.getDate()}/${weekEnd.getMonth()+1}`;

            doc.autoTable({
                startY: yPos,
                margin: { left: 10, right: 10 },
                head: [
                    [{content: `Horario Almuerzos ${rango}`, colSpan: 3, styles: {halign: 'center', fillColor: [255, 242, 0], textColor: [0,0,0], fontStyle: 'bold', fontSize: 10}}],
                    [
                        {content: '12:00', styles: {fillColor: [210, 245, 215], textColor: [0,0,0], halign: 'center', fontStyle: 'bold'}}, 
                        {content: '13:00', styles: {fillColor: [250, 230, 220], textColor: [0,0,0], halign: 'center', fontStyle: 'bold'}}, 
                        {content: '14:00', styles: {fillColor: [215, 240, 250], textColor: [0,0,0], halign: 'center', fontStyle: 'bold'}}
                    ]
                ],
                body: bodyData,
                theme: 'grid',
                styles: { fontSize: 7.5, cellPadding: 2, font: 'Helvetica' },
                columnStyles: {
                    0: { fillColor: [235, 255, 240] }, 
                    1: { fillColor: [255, 245, 240] },
                    2: { fillColor: [235, 248, 255] }
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.cell.raw && data.cell.raw.data) {
                        let fac = data.cell.raw.data.fac;
                        if (coloresFacultad[fac]) {
                            data.cell.styles.textColor = coloresFacultad[fac];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                }
            });

            yPos = doc.lastAutoTable.finalY + 15;
            if (yPos > 220 && w < 3) { 
                doc.addPage(); 
                yPos = 15; 
            }
        }

        doc.save("Cronograma_Almuerzos_Final.pdf");
    }
</script>
</body>
</html>
