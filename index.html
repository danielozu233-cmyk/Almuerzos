    const ordenFacultades = [

    // =========================================================

    const coloresFacultad = {

        "No Fac.": [128, 128, 128],

        "FACOM": [31, 110, 140],

        "FACEDU": [100, 180, 220],

        "Económicas": [190, 80, 40],

        "Salud": [210, 160, 10],

        "Jurídicas": [180, 20, 20],

        "Ingeniería": [60, 60, 60],

        "Arquitectura": [150, 70, 30],

        "Odonto.": [120, 40, 120],

        "Humanidades": [20, 20, 20],

        "UVIRTUAL": [40, 140, 60],

        "Teología": [100, 150, 190]

    };


    // =========================================================
    // MEZCLAR ARRAY
    // =========================================================

    function mezclarArray(array) {

        const resultado = [...array];

        for (
            let i = resultado.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                resultado[i],
                resultado[j]
            ] =
            [
                resultado[j],
                resultado[i]
            ];
        }

        return resultado;
    }


    // =========================================================
    // INTENTAR DISTRIBUCIÓN
    // =========================================================

    function intentarDistribucion() {

        /*
            SLOT 0 = 12:00
            SLOT 1 = 13:00
            SLOT 2 = 14:00
        */

        const slots = [
            [],
            [],
            []
        ];


        const facsPorSlot = [
            new Set(),
            new Set(),
            new Set()
        ];


        // Mezclar agentes

        let pool =
            mezclarArray(agentes);


        // =====================================================
        // MERLIN FIJO A LAS 12:00
        // =====================================================

        const merlinIndex =
            pool.findIndex(
                agente => agente.fijo12
            );


        if (merlinIndex !== -1) {

            const merlin =
                pool.splice(
                    merlinIndex,
                    1
                )[0];


            slots[0].push(merlin);

            facsPorSlot[0].add(
                merlin.fac
            );
        }


        // =====================================================
        // NÉSTOR FIJO A LAS 13:00
        // =====================================================

        const nestorIndex =
            pool.findIndex(
                agente => agente.fijo13
            );


        if (nestorIndex !== -1) {

            const nestor =
                pool.splice(
                    nestorIndex,
                    1
                )[0];


            slots[1].push(nestor);

            facsPorSlot[1].add(
                nestor.fac
            );
        }


        // =====================================================
        // CAPACIDAD
        // =====================================================

        const maxCapacidad =
            Math.ceil(
                agentes.length / 3
            );


        // =====================================================
        // COLOCAR AGENTE
        // =====================================================

        function colocarAgente(agente) {

            let permitidos =
                [0, 1, 2].filter(slot => {


                    // -----------------------------------------
                    // ENTRA A LAS 10
                    // NO PUEDE A LAS 12
                    // -----------------------------------------

                    if (
                        agente.in10 &&
                        slot === 0
                    ) {
                        return false;
                    }


                    // -----------------------------------------
                    // SALE A LAS 4
                    // NO PUEDE A LAS 2
                    // -----------------------------------------

                    if (
                        agente.out4 &&
                        slot === 2
                    ) {
                        return false;
                    }


                    // -----------------------------------------
                    // CAPACIDAD
                    // -----------------------------------------

                    if (
                        slots[slot].length >=
                        maxCapacidad
                    ) {
                        return false;
                    }


                    // -----------------------------------------
                    // NO REPETIR FACULTAD
                    // -----------------------------------------

                    if (
                        facsPorSlot[slot]
                            .has(agente.fac)
                    ) {
                        return false;
                    }


                    return true;

                });


            // =================================================
            // PRIORIZAR HORARIOS CON MENOS PERSONAS
            // =================================================

            permitidos.sort(
                (a, b) => {

                    const diferencia =
                        slots[a].length -
                        slots[b].length;


                    if (diferencia !== 0) {
                        return diferencia;
                    }


                    return Math.random() - 0.5;
                }
            );


            if (
                permitidos.length === 0
            ) {
                return false;
            }


            // Seleccionar horario

            const slot =
                permitidos[0];


            // Agregar

            slots[slot].push(
                agente
            );


            facsPorSlot[slot].add(
                agente.fac
            );


            return true;
        }


        // =====================================================
        // COLOCAR PRIMERO LOS AGENTES MÁS RESTRINGIDOS
        // =====================================================

        pool.sort(
            (a, b) => {

                const restriccionesA =
                    (a.in10 ? 1 : 0) +
                    (a.out4 ? 1 : 0);

                const restriccionesB =
                    (b.in10 ? 1 : 0) +
                    (b.out4 ? 1 : 0);

                return restriccionesB -
                       restriccionesA;
            }
        );


        // =====================================================
        // DISTRIBUIR
        // =====================================================

        for (
            const agente of pool
        ) {

            if (
                !colocarAgente(agente)
            ) {

                return null;
            }
        }


        // =====================================================
        // VALIDACIÓN FINAL
        // =====================================================

        for (
            let slot = 0;
            slot < 3;
            slot++
        ) {

            const facultades =
                new Set();


            for (
                const agente of slots[slot]
            ) {

                // No puede repetirse facultad

                if (
                    facultades.has(
                        agente.fac
                    )
                ) {

                    return null;
                }


                facultades.add(
                    agente.fac
                );


                // Validar IN10

                if (
                    agente.in10 &&
                    slot === 0
                ) {

                    return null;
                }


                // Validar OUT4

                if (
                    agente.out4 &&
                    slot === 2
                ) {

                    return null;
                }
            }
        }


        // =====================================================
        // VALIDAR FIJOS
        // =====================================================

        const merlin =
            agentes.find(
                agente => agente.fijo12
            );


        const nestor =
            agentes.find(
                agente => agente.fijo13
            );


        if (
            merlin &&
            !slots[0].includes(merlin)
        ) {

            return null;
        }


        if (
            nestor &&
            !slots[1].includes(nestor)
        ) {

            return null;
        }


        return slots;
    }


    // =========================================================
    // GENERAR PDF
    // =========================================================

    function generateMonthly() {

        const startStr =
            document
                .getElementById("startDate")
                .value;


        if (!startStr) {

            alert(
                "Selecciona el lunes inicial."
            );

            return;
        }


        // =====================================================
        // VALIDAR QUE SEA LUNES
        // =====================================================

        const fechaSeleccionada =
            new Date(
                startStr + "T00:00:00"
            );


        const diaSemana =
            fechaSeleccionada.getDay();


        if (diaSemana !== 1) {

            alert(
                "La fecha inicial debe ser un lunes."
            );

            return;
        }


        // =====================================================
        // CREAR PDF
        // =====================================================

        const { jsPDF } =
            window.jspdf;


        const doc =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const baseDate =
            new Date(
                startStr + "T00:00:00"
            );


        let yPos = 15;


        // =====================================================
        // 4 SEMANAS
        // =====================================================

        for (
            let semana = 0;
            semana < 4;
            semana++
        ) {

            // -------------------------------------------------
            // FECHA INICIO
            // -------------------------------------------------

            const weekStart =
                new Date(
                    baseDate
                );


            weekStart.setDate(
                baseDate.getDate() +
                (semana * 7)
            );


            // -------------------------------------------------
            // FECHA FIN - VIERNES
            // -------------------------------------------------

            const weekEnd =
                new Date(
                    weekStart
                );


            weekEnd.setDate(
                weekStart.getDate() +
                4
            );


            // =================================================
            // BUSCAR DISTRIBUCIÓN
            // =================================================

            let slots = null;

            let intentos = 0;

            const maxIntentos =
                20000;


            while (
                !slots &&
                intentos < maxIntentos
            ) {

                slots =
                    intentarDistribucion();

                intentos++;
            }


            // =================================================
            // ERROR
            // =================================================

            if (!slots) {

                alert(
                    `No se pudo generar una distribución válida para la Semana ${semana + 1}.`
                );

                return;
            }


            // =================================================
            // ORDENAR FACULTADES
            // =================================================

            for (
                let slot = 0;
                slot < 3;
                slot++
            ) {

                slots[slot].sort(
                    (a, b) => {

                        const indexA =
                            ordenFacultades
                                .indexOf(
                                    a.fac
                                );


                        const indexB =
                            ordenFacultades
                                .indexOf(
                                    b.fac
                                );


                        return (
                            indexA -
                            indexB
                        );
                    }
                );
            }


            // =================================================
            // CREAR CUERPO
            // =================================================

            const maxFilas =
                Math.max(
                    slots[0].length,
                    slots[1].length,
                    slots[2].length
                );


            const bodyData = [];


            for (
                let fila = 0;
                fila < maxFilas;
                fila++
            ) {

                bodyData.push([

                    slots[0][fila]
                        ?
                        {
                            content:
                                `${slots[0][fila].nombre}\n(${slots[0][fila].fac})`,

                            data:
                                slots[0][fila]
                        }
                        :
                        "",


                    slots[1][fila]
                        ?
                        {
                            content:
                                `${slots[1][fila].nombre}\n(${slots[1][fila].fac})`,

                            data:
                                slots[1][fila]
                        }
                        :
                        "",


                    slots[2][fila]
                        ?
                        {
                            content:
                                `${slots[2][fila].nombre}\n(${slots[2][fila].fac})`,

                            data:
                                slots[2][fila]
                        }
                        :
                        ""
                ]);
            }


            // =================================================
            // RANGO DE FECHAS
            // =================================================

            const rango =
                `${weekStart.getDate()}/${weekStart.getMonth() + 1}`
                +
                ` al `
                +
                `${weekEnd.getDate()}/${weekEnd.getMonth() + 1}`;


            // =================================================
            // TABLA
            // =================================================

            doc.autoTable({

                startY:
                    yPos,

                margin: {
                    left: 10,
                    right: 10
                },


                head: [

                    // -----------------------------------------
                    // TÍTULO
                    // -----------------------------------------

                    [

                        {
                            content:
                                `Horario Almuerzos ${rango}`,

                            colSpan: 3,

                            styles: {

                                halign:
                                    "center",

                                fillColor:
                                    [255, 242, 0],

                                textColor:
                                    [0, 0, 0],

                                fontStyle:
                                    "bold",

                                fontSize:
                                    10
                            }
                        }

                    ],


                    // -----------------------------------------
                    // HORARIOS
                    // -----------------------------------------

                    [

                        {
                            content:
                                "12:00",

                            styles: {

                                fillColor:
                                    [210, 245, 215],

                                textColor:
                                    [0, 0, 0],

                                halign:
                                    "center",

                                fontStyle:
                                    "bold"
                            }
                        },


                        {
                            content:
                                "13:00",

                            styles: {

                                fillColor:
                                    [250, 230, 220],

                                textColor:
                                    [0, 0, 0],

                                halign:
                                    "center",

                                fontStyle:
                                    "bold"
                            }
                        },


                        {
                            content:
                                "14:00",

                            styles: {

                                fillColor:
                                    [215, 240, 250],

                                textColor:
                                    [0, 0, 0],

                                halign:
                                    "center",

                                fontStyle:
                                    "bold"
                            }
                        }

                    ]

                ],


                body:
                    bodyData,


                theme:
                    "grid",


                styles: {

                    fontSize:
                        7.5,

                    cellPadding:
                        2,

                    font:
                        "Helvetica",

                    valign:
                        "middle"
                },


                columnStyles: {

                    0: {
                        fillColor:
                            [235, 255, 240]
                    },

                    1: {
                        fillColor:
                            [255, 245, 240]
                    },

                    2: {
                        fillColor:
                            [235, 248, 255]
                    }

                },


                // =================================================
                // COLOR POR FACULTAD
                // =================================================

                didParseCell:
                    function(data) {

                        if (
                            data.section === "body"
                            &&
                            data.cell.raw
                            &&
                            data.cell.raw.data
                        ) {

                            const fac =
                                data.cell.raw.data.fac;


                            if (
                                coloresFacultad[fac]
                            ) {

                                data.cell.styles.textColor =
                                    coloresFacultad[fac];


                                data.cell.styles.fontStyle =
                                    "bold";
                            }
                        }
                    }

            });


            // =================================================
            // POSICIÓN SIGUIENTE TABLA
            // =================================================

            yPos =
                doc.lastAutoTable.finalY +
                15;


            // =================================================
            // NUEVA PÁGINA
            // =================================================

            if (
                yPos > 220 &&
                semana < 3
            ) {

                doc.addPage();

                yPos = 15;
            }

        }


        // =====================================================
        // DESCARGAR
        // =====================================================

        doc.save(
            "Cronograma_Almuerzos_Final.pdf"
        );

    }

</script>
